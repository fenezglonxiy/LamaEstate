<app-chip>
  <app-chip-icon-content>
    <app-svg-icon
      [svgSpriteHref]="icon.iconSrc"
      [title]="icon.iconTitle"
      size="sm"
    />
  </app-chip-icon-content>

  <app-chip-label-content>
    <app-chip-label fontWeight="bold">{{ quantity }} {{ type }}</app-chip-label>
  </app-chip-label-content>
</app-chip>
