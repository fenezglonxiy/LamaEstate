<div class="app-estate-list grid-3-2">
  <div class="estate-list-section">
    <div class="estate-list flow-spacer-y">
      <app-estate-list-estate-search />

      <ul class="flow-spacer-y">
        @for (estate of estateData; track estate.id) {
        <app-estate-list-item
          [estateId]="estate.id"
          [estateThumbnailSrc]="estate.thumbnailSrc"
          [estateName]="estate.name"
          [estateAddress]="estate.address"
          [estatePrice]="estate.price"
          [estateBedroomQuantity]="estate.bedroomQuantity"
          [estateBathroomQuantity]="estate.bathroomQuantity"
        />
        }
      </ul>
    </div>
  </div>

  <div class="estate-location-map-section">
    <app-estate-location-map
      [locations]="mapLocations"
      [centerLatitude]="mapCenter.latitude"
      [centerLongitude]="mapCenter.longitude"
    />
  </div>
</div>

<div class="estate-list-pagination-section">
  <app-pagination>
    <app-pagination-content>
      <app-pagination-item>
        <app-pagination-previous />
      </app-pagination-item>

      <app-pagination-item>
        <app-pagination-goto />
      </app-pagination-item>

      <app-pagination-item>
        <app-pagination-next />
      </app-pagination-item>
    </app-pagination-content>
  </app-pagination>
</div>
