<app-estate-feature featureName="General">
  <div role="list" class="estate-general-feature-list">
    @for (item of items; track $index) {
    <app-chip
      class="estate-general-feature-list-item"
      role="listitem"
      [spacing]="2.5"
    >
      <app-chip-icon-content>
        <app-svg-icon [svgSpriteHref]="item.iconSrc" [title]="item.iconTitle" />
      </app-chip-icon-content>

      <app-chip-label-content>
        <app-chip-label fontWeight="bold">{{ item.label }}</app-chip-label>
        <app-chip-description variant="sm">{{
          item.description
        }}</app-chip-description>
      </app-chip-label-content>
    </app-chip>
    }
  </div>
</app-estate-feature>
